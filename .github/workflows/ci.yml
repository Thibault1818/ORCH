name: CI

on:
  push:
    branches: [main, hardening/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- test/security/security-regression.test.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:dist
      - name: Verify reproducible distribution
        run: |
          node scripts/verify-release-artifacts.mjs dist-manifest dist /tmp/dist-before.tsv
          npm run build:dist
          node scripts/verify-release-artifacts.mjs dist-manifest dist /tmp/dist-after.tsv
          diff /tmp/dist-before.tsv /tmp/dist-after.tsv
      - name: Verify Git-installable package includes workflow distribution
        run: |
          npm pack --dry-run --json --ignore-scripts > package-manifest.json
          node -e "const p=require('./package-manifest.json')[0].files.map(f=>f.path); for (const f of ['dist/cli.js','dist/index.js','dist/index.d.ts','npm-shrinkwrap.json','skills/orch/SKILL.md']) if (!p.includes(f)) throw new Error('missing '+f)"
          rm package-manifest.json
      - run: npm audit --omit=dev
      - run: test -z "$(git status --porcelain)"

  git-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install exact commit in isolated prefix
        shell: bash
        run: |
          bash scripts/ci-git-install.sh
